name: Bug report
description: Report a software, browser, accessibility, or UI-state problem.
title: "[Bug]: "
labels:
  - bug
body:
  - type: input
    id: browser
    attributes:
      label: Browser and version
    validations:
      required: true
  - type: input
    id: url
    attributes:
      label: Exact URL / shared scenario
  - type: textarea
    id: steps
    attributes:
      label: Steps to reproduce
    validations:
      required: true
  - type: textarea
    id: expected
    attributes:
      label: Expected behavior
    validations:
      required: true
  - type: textarea
    id: actual
    attributes:
      label: Actual behavior
    validations:
      required: true
