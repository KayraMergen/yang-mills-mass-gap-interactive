name: Quality audit

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Run v6 model/state regression checks
        run: node scripts/test-v6-core.cjs
      - name: Validate publication and audit structure
        run: node scripts/validate.mjs
